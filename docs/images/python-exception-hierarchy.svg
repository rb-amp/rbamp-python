th d="M700 452 L760 452" class="ln-thin"></path></g><g class="rb-box"><rect x="760" y="512" width="600" height="92" rx="10" class="box-white"></rect><text x="774" y="545.02" class="t-body t-navy t-bold t-mono"><tspan x="774" dy="0">RbAmpStaleError</tspan></text><text x="774" y="571.98" class="t-small"><tspan x="774" dy="0">period snapshot is stale (valid flag = 0) — read again</tspan></text></g><g><path d="M700 558 L760 558" class="ln-thin"></path></g><g class="rb-box"><rect x="760" y="618" width="600" height="92" rx="10" class="box-white"></rect><text x="774" y="651.02" class="t-body t-navy t-bold t-mono"><tspan x="774" dy="0">RbAmpVersionError</tspan></text><text x="774" y="677.98" class="t-small"><tspan x="774" dy="0">module firmware version not supported by this library</tspan></text></g><g><path d="M700 664 L760 664" class="ln-thin"></path></g></svg>